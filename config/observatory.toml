# QV Observatory configuration.
# Patterns are case-insensitive Python regexes, matched per document language.
# Documents tagged lang = "mul" (e.g. Belgian ParlaMint) are matched against every language.

[project]
name = "QV Observatory"
db_path = "data/observatory.sqlite"
site_data = "site/data/observatory.json"

[domains]
# label shown on the site, in the order lanes are drawn
policy = "EU policy"
parliament = "Parliaments"
news = "News"
art = "Art discourse"

[analysis]
series_granularity = "month"   # month | year
onset_fraction = 0.25          # onset = first period reaching this fraction of the domain's peak rate
min_docs_per_period = 5        # periods with fewer documents are treated as missing
max_lag_months = 36            # cross-correlation search window
min_mentions_for_lag = 30      # a lag needs this many mentioning documents in each domain
min_periods_for_lag = 12       # ... and this many periods where both domains have data
drift_window = 8               # tokens either side of a concept mention
drift_top_k = 25               # neighbours compared between periods
stopword_max_df = 0.3          # tokens in more than this share of a language's documents are stopwords

[oie]
model = "claude-haiku-5-5"     # verified current 2026-11; check docs.claude.com before large runs
effort = "low"                 # extraction needs little reasoning; part of the cache key
prompt_version = "v1"
batch_size = 20
max_sentence_chars = 600

[ontology]
# Planned for v0.2 (see CLAUDE.md): ontology-gap index against Wikidata.
wikidata_endpoint = "https://query.wikidata.org/sparql"

[concepts.resilience]
label = "resilience"
about = "Borrowed from engineering and ecology (a material or system that bounces back after a shock). Since the 2010s it has become a central word of EU policy: economies, supply chains, democracies and citizens are all asked to be resilient. Critics say it moves responsibility for coping with crises onto individuals."
en = 'resilien\w*'
pt = 'resili[eê]n\w*'
nl = 'veerkracht\w*|weerbaarheid|resilien\w*'
fr = 'r[ée]silien\w*'
de = 'resilien\w*|widerstandsf[äa]higkeit'
es = 'resilien\w*'
it = 'resilien\w*'

[concepts.community]
label = "community"
about = "An old word with many uses: a village, a group sharing an identity, or the 'European Community' itself. In policy and art it often signals bottom-up participation. Watch for the institutional sense (the Community) mixing with the social one."
en = 'communit(?:y|ies)'
pt = 'comunidades?'
nl = 'gemeenschap\w*'
fr = 'communaut[ée]s?'
de = 'gemeinschaft\w*|community'
es = 'comunidad(?:es)?'
it = 'comunit[àa]'

[concepts.sustainability]
label = "sustainability"
about = "From forestry (harvest no more than grows back) to the UN's 1987 definition of development that meets present needs without compromising future generations. Now attached to almost anything (finance, growth, tourism), which is part of what this observatory tracks."
en = 'sustainab\w*'
pt = 'sustentab\w*|sustent[áa]ve\w*'
nl = 'duurzaam\w*'
fr = 'durabilit[ée]|durables?'
de = 'nachhaltig\w*'
es = 'sostenib\w*'
it = 'sostenibil\w*'

[concepts.care]
label = "care"
about = "Care work, healthcare, and since the pandemic an ethics and politics of care, which spread fast in art and academia. In English the word is also very ordinary ('take care'), so its counts include everyday uses."
en = 'care|caring'
pt = 'cuidados?|cuidar'
nl = 'zorg\w*'
fr = 'soins?|care'
de = 'f[üu]rsorge|sorgearbeit|care'
es = 'cuidados?|cuidar'
it = 'cura|cure'

[concepts.inclusion]
label = "inclusion"
about = "Social inclusion entered EU vocabulary in the 1990s (fighting poverty and exclusion) and later widened to disability, gender and diversity. In art institutions it names access and representation programmes."
en = 'inclusi\w*'
pt = 'inclus\w*'
nl = 'inclusi\w*'
fr = 'inclusi\w*'
de = 'inklusi\w*'
es = 'inclusi\w*'
it = 'inclusi\w*'

[concepts.decolonial]
label = "decolonial"
about = "From Latin American theory (Quijano, Mignolo) on the 'coloniality' that outlived colonial rule. Common in art and universities since the late 2010s, still rare in EU policy. A clear test of whether policy follows art or the other way round."
en = 'decoloni\w*'
pt = 'descoloni\w*|decoloni\w*'
nl = 'dekoloni\w*'
fr = 'd[ée]coloni\w*'
de = 'dekoloni\w*'
es = 'descoloni\w*|decoloni\w*'
it = 'decoloni\w*'

[concepts.polycrisis]
label = "polycrisis"
about = "Used by Edgar Morin in the 1990s and revived in 2022 by Jean-Claude Juncker and Adam Tooze for overlapping crises (pandemic, war, energy, climate). A recent word, so it shows how fast new vocabulary travels."
en = 'polycris[ie]s'
pt = 'policrises?'
nl = 'polycrisis'
fr = 'polycrises?'
de = 'polykrisen?'
es = 'policrisis'
it = 'policrisi'

# GDELT news volume: plain terms joined by " OR " (GDELT has no wildcards or regexes).
# Languages: en, fr, nl, pt. Multi-word phrases are quoted automatically.
[concepts.resilience.gdelt]
en = "resilience OR resilient"
fr = "résilience OR résilient"
nl = "veerkracht OR weerbaarheid"
pt = "resiliência OR resiliente"

[concepts.community.gdelt]
en = "community OR communities"
fr = "communauté OR communautés"
nl = "gemeenschap OR gemeenschappen"
pt = "comunidade OR comunidades"

[concepts.sustainability.gdelt]
en = "sustainability OR sustainable"
fr = "durabilité OR durable"
nl = "duurzaamheid OR duurzaam"
pt = "sustentabilidade OR sustentável"

[concepts.care.gdelt]
en = "care OR caring"
fr = "soins OR care"
nl = "zorg"
pt = "cuidado OR cuidados"

[concepts.inclusion.gdelt]
en = "inclusion OR inclusive"
fr = "inclusion OR inclusif"
nl = "inclusie OR inclusief"
pt = "inclusão OR inclusivo"

[concepts.decolonial.gdelt]
en = "decolonial OR decolonization OR decolonisation"
fr = "décolonial OR décolonisation"
nl = "dekolonisatie OR dekoloniaal"
pt = "decolonial OR descolonização"

[concepts.polycrisis.gdelt]
en = "polycrisis"
fr = "polycrise"
nl = "polycrisis"
pt = "policrise"

