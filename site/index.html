<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QV Observatory</title>
<style>
:root { --bg: #fff; --fg: #000; --line: #999; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #111; --fg: #eee; --line: #666; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #111; --fg: #eee; --line: #666; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: "Times New Roman", Times, serif; max-width: 60rem; margin: 0 auto; padding: 1rem; }
table { border-collapse: collapse; }
th, td { border: 1px solid var(--line); padding: .2rem .5rem; text-align: left; vertical-align: top; }
svg { display: block; width: 100%; max-width: 60rem; height: auto; }
svg text { fill: var(--fg); font: 13px "Times New Roman", Times, serif; }
.scroll { overflow-x: auto; }
select { font: inherit; }
</style>
</head>
<body>
<h1>QV Observatory</h1>
<p>How concepts travel through European discourse: EU policy, parliaments, news and art writing.</p>
<div id="app"><p>Loading…</p></div>
<script>
const LANG = { en: "English", pt: "Portuguese", nl: "Dutch", fr: "French", de: "German", es: "Spanish", it: "Italian" };
let D, driftLang;

const h = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) n.append(k instanceof Node ? k : String(k));
  return n;
};
const s = (tag, attrs = {}) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};
const table = (head, rows) => h("table", {},
  h("thead", {}, h("tr", {}, head.map(x => h("th", {}, x)))),
  h("tbody", {}, rows.map(r => h("tr", {}, r.map(x => h("td", {}, x))))));
const dom = d => D.meta.domains[d] || d;

async function init() {
  try {
    const r = await fetch("data/observatory.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    D = await r.json();
  } catch {
    document.getElementById("app").replaceChildren(h("p", {},
      "No data yet. Run python -m observatory export, then serve this folder."));
    return;
  }
  addEventListener("hashchange", render);
  render();
}

function render() {
  const keys = Object.keys(D.concepts);
  const want = decodeURIComponent(location.hash.slice(1));
  const k = keys.includes(want) ? want : keys.find(x => D.migration.concepts[x]?.mentions) || keys[0];
  const mig = D.migration.concepts[k] || {};
  const app = document.getElementById("app");
  app.replaceChildren();

  if (D.meta.synthetic) app.append(h("p", {}, h("b", {}, "Note: "),
    "synthetic test data. These patterns were planted to check the pipeline and say nothing about real discourse."));

  app.append(h("p", {}, "Concepts: ", keys.flatMap((x, i) => {
    const n = D.migration.concepts[x]?.mentions || 0;
    const label = `${D.concepts[x].label} (${n.toLocaleString("en")})`;
    return [i ? " · " : "", x === k ? h("b", {}, label) : h("a", { href: "#" + x }, label)];
  })));

  app.append(h("h2", {}, D.concepts[k].label));
  if (!mig.series) { app.append(h("p", {}, "No mentions in the corpus yet.")); return footer(app); }

  const firsts = mig.first_by_lang || [];
  if (firsts.length) {
    app.append(h("h3", {}, "First use per language"));
    app.append(table(["Language", "First seen", "Domain"], firsts.map(f => [LANG[f.lang] || f.lang, f.date, dom(f.domain)])));
  }

  app.append(h("h3", {}, "Usage over time"));
  app.append(h("p", {}, "Share of documents in each domain that use the concept, per period. ",
    "The vertical mark is the onset: the first period reaching a quarter of the domain's peak."));
  app.append(h("div", { class: "scroll" }, chart(mig)));

  const lags = (mig.lags || []).filter(l => l.lag > 0).slice(0, 6);
  if (lags.length) {
    const unit = D.migration.granularity === "month" ? "months" : "years";
    app.append(h("h3", {}, "Which domain follows which"));
    app.append(table(["Follower", "Leader", `Lag (${unit})`, "Correlation r", "Periods compared"],
      lags.map(l => [dom(l.follow), dom(l.lead), l.lag, l.r.toFixed(2), l.periods ?? ""])));
  } else {
    app.append(h("h3", {}, "Which domain follows which"));
    app.append(h("p", {}, "Not enough evidence yet: a lag needs at least 30 mentioning documents in each domain ",
      "and 12 periods where both have data."));
  }

  drift(app, D.drift[k] || {});
  const ag = D.agency[k];
  if (ag) {
    app.append(h("h3", {}, "Concept as grammatical subject"));
    app.append(h("p", {}, `Share of ${ag.triples.toLocaleString("en")} extracted relations where the concept is the subject.`));
    app.append(table(["Domain", "Share"], Object.entries(ag.by_domain).map(([d, v]) => [dom(d), Math.round(v.agency * 100) + "%"])));
    if (ag.agent_relations.length) app.append(h("p", {}, "Most frequent relations: " +
      ag.agent_relations.slice(0, 8).map(([r]) => r).join(", ") + "."));
  }
  footer(app);
}

function chart(mig) {
  const P = D.migration.periods, doms = activeDomains();
  const W = 900, L = 110, laneH = 50, gap = 12, axis = 20, H = doms.length * (laneH + gap) + axis;
  const x = i => L + (i / Math.max(1, P.length - 1)) * (W - L - 30);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Usage rate over time per domain" });
  doms.forEach((d, li) => {
    const base = li * (laneH + gap) + laneH, vals = mig.series[d] || [];
    const peak = Math.max(1e-4, ...vals.filter(v => v != null));
    svg.append(s("line", { x1: L, x2: W - 30, y1: base, y2: base, stroke: "var(--line)" }));
    const t = s("text", { x: 0, y: base - laneH / 2 + 4 }); t.textContent = dom(d); svg.append(t);
    let p = "", open = false;
    vals.forEach((v, i) => {
      if (v == null) { open = false; return; }
      p += `${open ? "L" : "M"}${x(i).toFixed(1)},${(base - v / peak * (laneH - 4)).toFixed(1)}`; open = true;
    });
    if (p) svg.append(s("path", { d: p, fill: "none", stroke: "var(--fg)", "stroke-width": 1.25 }));
    const oi = P.indexOf(mig.onsets[d]);
    if (oi >= 0) svg.append(s("line", { x1: x(oi), x2: x(oi), y1: base - laneH, y2: base, stroke: "var(--fg)", "stroke-width": 2 }));
  });
  [...new Set(P.map(p => p.slice(0, 4)))].forEach(y => {
    const t = s("text", { x: x(P.findIndex(p => p.startsWith(y))), y: H - 4, "text-anchor": "middle" });
    t.textContent = y; svg.append(t);
  });
  return svg;
}

function drift(app, byLang) {
  const langs = Object.keys(byLang);
  app.append(h("h3", {}, "Collocates per year"));
  if (!langs.length) { app.append(h("p", {}, "Not enough context yet to measure drift.")); return; }
  driftLang = langs.includes(driftLang) ? driftLang : (langs.includes("en") ? "en" : langs[0]);
  const sel = h("select", { id: "lang" }, langs.map(l => {
    const o = h("option", { value: l }, LANG[l] || l); if (l === driftLang) o.selected = true; return o;
  }));
  sel.addEventListener("change", () => { driftLang = sel.value; render(); });
  app.append(h("p", {}, h("label", { for: "lang" }, "Language: "), sel,
    " Drift is the share of the list that changed since the previous year."));
  const { neighbours, drift } = byLang[driftLang];
  const by = Object.fromEntries(drift.map(d => [d.to, d]));
  app.append(table(["Year", "Strongest collocates", "Drift", "New", "Dropped"],
    Object.entries(neighbours).map(([y, list]) => {
      const d = by[y];
      return [y, list.map(([w]) => w).join(", "), d ? d.drift.toFixed(2) : "", d ? d.entered.join(", ") : "", d ? d.left.join(", ") : ""];
    })));
}

function activeDomains() {
  return Object.keys(D.meta.domains).filter(d => (D.migration.documents[d] || []).some(n => n > 0));
}

function coverage(app) {
  const SOURCE = { policy: "EUR-Lex (European Commission documents, English)",
    parliament: "European Parliament plenary debates", news: "GDELT article counts", art: "" };
  const rows = Object.keys(D.meta.domains).map(d => {
    const docs = D.meta.corpus.filter(r => r.domain === d);
    const cnt = (D.meta.counts || []).filter(r => r.domain === d);
    const all = [...docs, ...cnt];
    if (!all.length) return [dom(d), "no source yet", "", "", ""];
    const n = docs.reduce((a, r) => a + r.n, 0);
    const first = all.map(r => r.first).sort()[0], last = all.map(r => r.last).sort().at(-1);
    const langs = [...new Set(all.map(r => r.lang))].join(", ");
    return [dom(d), SOURCE[d] || "", n ? n.toLocaleString("en") + " documents" : "counts only", `${first} to ${last}`, langs];
  });
  app.append(h("h3", {}, "Coverage"));
  app.append(table(["Domain", "Source", "Size", "Dates", "Languages"], rows));
  app.append(h("p", {}, `Periods with fewer than ${D.meta.min_docs_per_period ?? 5} documents in a domain are left blank.`));
}

function footer(app) {
  coverage(app);
  app.append(h("hr"), h("p", {}, h("small", {}, `Generated ${D.meta.generated}. Sources: ${D.meta.sources.join(", ")}. `,
    "Corpus: " + D.meta.corpus.reduce((a, r) => a + r.n, 0).toLocaleString("en") + " documents. ",
    "EUR-Lex and European Parliament texts are reused with attribution; only derived statistics are shown.")));
}

init();
</script>
</body>
</html>
