<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QV Observatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --paper: #F2F3F5; --ink: #1B2430; --muted: #5C6673; --rule: #D5D9DF; --panel: #FFFFFF;
  --policy: #3354A4; --parliament: #8A6D1F; --news: #2E7D74; --art: #B0306A;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #15191F; --ink: #E6E8EB; --muted: #9AA3AE; --rule: #2C333C; --panel: #1C2129;
    --policy: #7E9BE6; --parliament: #D4B25A; --news: #5FC2B6; --art: #E46FA4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #15191F; --ink: #E6E8EB; --muted: #9AA3AE; --rule: #2C333C; --panel: #1C2129;
  --policy: #7E9BE6; --parliament: #D4B25A; --news: #5FC2B6; --art: #E46FA4;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.6 var(--sans); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--policy); outline-offset: 3px; }

.shell { display: grid; grid-template-columns: 15rem minmax(0, 1fr); max-width: 78rem; margin: 0 auto; min-height: 100vh; }
nav { border-right: 1px solid var(--rule); padding: 2rem 1.5rem; }
nav h1 { font: 600 1rem/1.3 var(--sans); margin: 0 0 .25rem; }
nav p { color: var(--muted); font-size: .85rem; margin: 0 0 2rem; }
nav ul { list-style: none; margin: 0; padding: 0; }
nav button {
  all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline;
  width: 100%; padding: .35rem 0; font: 400 1.15rem/1.3 var(--serif); color: var(--muted);
}
nav button span { font: 400 .75rem var(--sans); }
nav button[aria-current="true"] { color: var(--ink); font-weight: 600; }
nav button:hover { color: var(--ink); }
nav button:disabled { opacity: .4; cursor: default; }

main { padding: 2.5rem clamp(1rem, 4vw, 3.5rem) 4rem; min-width: 0; }
.notice { border-left: 3px solid var(--art); background: var(--panel); padding: .75rem 1rem; font-size: .9rem; margin-bottom: 2rem; }
.word { font: 600 clamp(3rem, 9vw, 6.5rem)/1 var(--serif); letter-spacing: -.02em; margin: 0; }
.variants { display: flex; flex-wrap: wrap; gap: .5rem 1.75rem; margin: 1.25rem 0 0; padding: 0; list-style: none; }
.variants li { font-size: .9rem; color: var(--muted); }
.variants b { font: 400 1.05rem var(--serif); color: var(--ink); margin-right: .4rem; }
section { margin-top: 3.5rem; }
h2 { font: 600 1.35rem/1.3 var(--serif); margin: 0 0 .35rem; }
.lede { color: var(--muted); margin: 0 0 1.25rem; max-width: 62ch; }

.chart-wrap { overflow-x: auto; }
svg.lanes { display: block; width: 100%; min-width: 40rem; height: auto; }
svg text { font-family: var(--sans); fill: var(--muted); font-size: 12px; }
svg .lane-label { fill: var(--ink); font-weight: 500; font-size: 13px; }
.findings { list-style: none; padding: 0; margin: 1.25rem 0 0; max-width: 62ch; }
.findings li { padding: .55rem 0; border-top: 1px solid var(--rule); font-family: var(--serif); font-size: 1.05rem; }
.findings small { font-family: var(--sans); color: var(--muted); margin-left: .35rem; }

.lang-pick { display: flex; gap: .4rem; margin-bottom: 1rem; flex-wrap: wrap; }
.lang-pick button {
  font: 500 .85rem var(--sans); color: var(--ink); background: transparent;
  border: 1px solid var(--rule); border-radius: 2rem; padding: .3rem .8rem; cursor: pointer;
}
.lang-pick button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.years { border-collapse: collapse; width: 100%; }
.years th { font: 600 .95rem var(--serif); text-align: left; vertical-align: top; padding: .7rem 1.25rem .7rem 0; white-space: nowrap; }
.years td { padding: .7rem 0; border-top: 1px solid var(--rule); font-size: .95rem; }
.years th { border-top: 1px solid var(--rule); }
.years .new { color: var(--art); font-weight: 600; }
.years .shift { display: block; color: var(--muted); font-size: .8rem; margin-top: .2rem; }

.bars { display: grid; grid-template-columns: 8rem 1fr 3rem; gap: .5rem 1rem; align-items: center; max-width: 40rem; }
.bar { height: .7rem; border-radius: .35rem; }
.empty { color: var(--muted); max-width: 60ch; }
code { font-size: .85em; background: var(--panel); padding: .1em .35em; border-radius: .25rem; }
footer { margin-top: 4rem; color: var(--muted); font-size: .8rem; }

@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  nav { border-right: 0; border-bottom: 1px solid var(--rule); padding: 1.25rem 1rem; }
  nav p { margin-bottom: 1rem; }
  nav ul { display: flex; gap: 1.25rem; overflow-x: auto; }
  nav button { width: auto; white-space: nowrap; }
  nav button span { display: none; }
}
</style>
</head>
<body>
<div class="shell">
  <nav aria-label="Concepts">
    <h1>QV Observatory</h1>
    <p>How concepts travel through European discourse</p>
    <ul id="concepts"></ul>
  </nav>
  <main id="main"><p class="empty">Loading the observatory data…</p></main>
</div>
<script>
const DOMAIN_VAR = { policy: "--policy", parliament: "--parliament", news: "--news", art: "--art" };
const LANG_NAME = { en: "English", pt: "Portuguese", nl: "Dutch", fr: "French", de: "German", es: "Spanish", it: "Italian" };
let DATA, current, driftLang;

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (n.className = v) : n.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) n.append(k instanceof Node ? k : document.createTextNode(k));
  return n;
};
const svgEl = (tag, attrs = {}) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};
const color = d => `var(${DOMAIN_VAR[d] || "--muted"})`;
const months = n => n === 1 ? "1 month" : `${n} months`;

async function init() {
  try {
    const r = await fetch("data/observatory.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
  } catch {
    document.getElementById("main").replaceChildren(el("p", { class: "empty" },
      "No data yet. Run ", el("code", {}, "python -m observatory export"),
      " to write site/data/observatory.json, then serve this folder with ",
      el("code", {}, "python -m http.server"), "."));
    return;
  }
  const keys = Object.keys(DATA.concepts);
  const list = document.getElementById("concepts");
  for (const k of keys) {
    const m = DATA.migration.concepts[k]?.mentions || 0;
    const b = el("button", { type: "button", "data-key": k }, DATA.concepts[k].label, el("span", {}, m.toLocaleString("en")));
    if (!m) b.disabled = true;
    b.addEventListener("click", () => { location.hash = k; });
    list.append(el("li", {}, b));
  }
  window.addEventListener("hashchange", route);
  route();
}

function route() {
  const keys = Object.keys(DATA.concepts);
  const fromHash = decodeURIComponent(location.hash.slice(1));
  const k = keys.includes(fromHash) ? fromHash
    : keys.find(x => DATA.migration.concepts[x]?.mentions) || keys[0];
  current = k;
  driftLang = null;
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.key === k));
  render();
}

function render() {
  const k = current, c = DATA.concepts[k], mig = DATA.migration.concepts[k] || {};
  const main = document.getElementById("main");
  main.replaceChildren();
  if (DATA.meta.synthetic) main.append(el("div", { class: "notice", role: "note" },
    "Synthetic test data. These patterns were planted to check the pipeline and say nothing about real discourse."));

  main.append(el("h2", { class: "word" }, c.label));
  const firsts = mig.first_by_lang || [];
  if (firsts.length) main.append(el("ul", { class: "variants", "aria-label": "First use per language" },
    firsts.map(f => el("li", {}, el("b", {}, LANG_NAME[f.lang] || f.lang), `first seen ${f.date}, ${DATA.meta.domains[f.domain] || f.domain}`))));

  main.append(migrationSection(mig));
  main.append(driftSection(DATA.drift[k] || {}));
  const ag = DATA.agency[k];
  if (ag) main.append(agencySection(ag));
  main.append(el("footer", {}, `Generated ${DATA.meta.generated}. Sources: ${DATA.meta.sources.join(", ")}.`));
}

function migrationSection(mig) {
  const s = el("section", {}, el("h2", {}, "Where it surfaced"),
    el("p", { class: "lede" }, "Share of documents in each domain that use the concept, per period. The ticks mark onset, the first period at a quarter of the domain’s peak; the line follows the concept from lane to lane."));
  const periods = DATA.migration.periods, domains = Object.keys(DATA.meta.domains);
  if (!mig.series || !periods.length) return s.append(el("p", { class: "empty" }, "No mentions in the corpus yet.")), s;

  const W = 900, labelW = 120, laneH = 64, gap = 14, top = 10, axisH = 26;
  const H = top + domains.length * (laneH + gap) + axisH;
  const x = i => labelW + (i / Math.max(1, periods.length - 1)) * (W - labelW - 10);
  const svg = svgEl("svg", { class: "lanes", viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Usage rate over time per domain, with onset markers" });
  const onsetPts = [];
  domains.forEach((d, li) => {
    const y0 = top + li * (laneH + gap), base = y0 + laneH;
    const vals = mig.series[d] || [];
    const peak = Math.max(0.0001, ...vals.filter(v => v != null));
    svg.append(svgEl("line", { x1: labelW, x2: W - 10, y1: base, y2: base, stroke: "var(--rule)" }));
    const lbl = svgEl("text", { x: 0, y: base - laneH / 2 + 4, class: "lane-label" });
    lbl.textContent = DATA.meta.domains[d];
    svg.append(lbl);
    let path = "", open = false;
    vals.forEach((v, i) => {
      if (v == null) { open = false; return; }
      const px = x(i), py = base - (v / peak) * (laneH - 6);
      path += `${open ? "L" : "M"}${px.toFixed(1)},${py.toFixed(1)}`;
      open = true;
    });
    if (path) svg.append(svgEl("path", { d: path, fill: "none", stroke: color(d), "stroke-width": 1.75, "stroke-linejoin": "round" }));
    const on = mig.onsets[d], oi = on ? periods.indexOf(on) : -1;
    if (oi >= 0) {
      svg.append(svgEl("line", { x1: x(oi), x2: x(oi), y1: y0 + 2, y2: base, stroke: color(d), "stroke-width": 2.5 }));
      onsetPts.push([x(oi), y0 + laneH / 2]);
    }
  });
  if (onsetPts.length > 1) svg.insertBefore(svgEl("polyline", { points: onsetPts.map(p => p.join(",")).join(" "),
    fill: "none", stroke: "var(--ink)", "stroke-width": 1, "stroke-dasharray": "3 4", opacity: .55 }), svg.firstChild);
  const years = [...new Set(periods.map(p => p.slice(0, 4)))];
  years.forEach(yr => {
    const i = periods.findIndex(p => p.startsWith(yr));
    const t = svgEl("text", { x: x(i), y: H - 6, "text-anchor": "middle" });
    t.textContent = yr;
    svg.append(t);
  });
  s.append(el("div", { class: "chart-wrap" }, svg));

  const unit = DATA.migration.granularity === "month" ? months : n => `${n} year${n === 1 ? "" : "s"}`;
  const best = (mig.lags || []).filter(l => l.lag > 0).slice(0, 4);
  if (best.length) s.append(el("ul", { class: "findings" }, best.map(l => el("li", {},
    `${DATA.meta.domains[l.follow]} follows ${DATA.meta.domains[l.lead]} by ${unit(l.lag)}.`,
    el("small", {}, `r = ${l.r.toFixed(2)}`)))));
  return s;
}

function driftSection(byLang) {
  const s = el("section", {}, el("h2", {}, "What it keeps company with"),
    el("p", { class: "lede" }, "Strongest collocates per year. Words new to the list are marked; the drift score is the share of the list that changed since the previous year."));
  const langs = Object.keys(byLang);
  if (!langs.length) return s.append(el("p", { class: "empty" }, "Not enough context yet to measure drift.")), s;
  driftLang = driftLang && langs.includes(driftLang) ? driftLang : (langs.includes("en") ? "en" : langs[0]);
  const pick = el("div", { class: "lang-pick", role: "group", "aria-label": "Language" });
  langs.forEach(l => {
    const b = el("button", { type: "button", "aria-pressed": l === driftLang }, LANG_NAME[l] || l);
    b.addEventListener("click", () => { driftLang = l; render(); });
    pick.append(b);
  });
  s.append(pick);
  const { neighbours, drift } = byLang[driftLang];
  const driftTo = Object.fromEntries(drift.map(d => [d.to, d]));
  const tbody = el("tbody");
  for (const [yr, list] of Object.entries(neighbours)) {
    const d = driftTo[yr], entered = new Set(d ? d.entered : []);
    const td = el("td", {}, ...list.flatMap(([w], i) => [i ? ", " : "", entered.has(w) ? el("span", { class: "new" }, w) : w]));
    if (d) td.append(el("span", { class: "shift" }, `drift ${d.drift.toFixed(2)}${d.left.length ? `; dropped ${d.left.join(", ")}` : ""}`));
    tbody.append(el("tr", {}, el("th", { scope: "row" }, yr), td));
  }
  s.append(el("table", { class: "years" }, tbody));
  return s;
}

function agencySection(ag) {
  const s = el("section", {}, el("h2", {}, "When the concept becomes an actor"),
    el("p", { class: "lede" }, `Share of extracted relations where the concept is the grammatical subject, from ${ag.triples.toLocaleString("en")} triples.`));
  const grid = el("div", { class: "bars" });
  for (const [d, v] of Object.entries(ag.by_domain)) {
    grid.append(el("span", {}, DATA.meta.domains[d] || d),
      el("div", {}, el("div", { class: "bar", style: `width:${Math.max(2, v.agency * 100)}%;background:${color(d)}` })),
      el("span", {}, `${Math.round(v.agency * 100)}%`));
  }
  s.append(grid);
  if (ag.agent_relations.length) s.append(el("p", { class: "lede", style: "margin-top:1.25rem" },
    "What it does most often: " + ag.agent_relations.slice(0, 8).map(([r]) => r).join(", ") + "."));
  return s;
}

init();
</script>
</body>
</html>
